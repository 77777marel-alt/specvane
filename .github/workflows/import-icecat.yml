# Ночной импорт смартфонов из Open Icecat → Supabase (этап 1, шаг 4).
# Секреты репозитория (вводит Максим): SUPABASE_SERVICE_ROLE_KEY, ICECAT_API_TOKEN.
name: Import Icecat

on:
  schedule:
    - cron: '17 2 * * *'   # каждый день 02:17 UTC
  workflow_dispatch:
    inputs:
      categories:
        description: 'Категории через пробел'
        default: 'smartphones headphones laptops tvs tablets smartwatches monitors speakers cameras projectors graphics-cards game-consoles washing-machines tumble-dryers fridges coffee-machines'
      max_products:
        description: 'Сколько карточек загрузить за запуск (на категорию)'
        default: '1500'
      seed_ids:
        description: 'Только эти Icecat ID через запятую (необязательно)'
        default: ''
      skip_index:
        description: 'Не качать индекс (1 = да)'
        default: '0'
      dry_run:
        description: 'Пробный запуск без записи в базу (1 = да)'
        default: '0'

concurrency:
  group: import-icecat
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - run: node --test scripts/icecat/map.test.mjs scripts/icecat/categories.test.mjs
      - name: Categories
        if: ${{ github.event.inputs.dry_run != '1' }}
        run: node scripts/icecat/sync-categories.mjs
        env:
          SUPABASE_URL: https://kjjffgjsgizozleflbhw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Import
        run: |
          first=1
          for c in $CATS; do
            if [ "$first" = 1 ]; then SI="$SKIP_INDEX"; else SI=1; fi
            echo "::group::$c"
            CATEGORY=$c SKIP_INDEX=$SI node scripts/icecat/import.mjs || echo "::warning::Импорт $c завершился с ошибкой"
            echo "::endgroup::"
            first=0
          done
        env:
          SUPABASE_URL: https://kjjffgjsgizozleflbhw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ICECAT_API_TOKEN: ${{ secrets.ICECAT_API_TOKEN }}
          ICECAT_USER: specvane
          CATS: ${{ github.event.inputs.categories || 'smartphones headphones laptops tvs tablets smartwatches monitors speakers cameras projectors graphics-cards game-consoles washing-machines tumble-dryers fridges coffee-machines' }}
          MAX_PRODUCTS: ${{ github.event.inputs.max_products || '1500' }}
          SEED_ICECAT_IDS: ${{ github.event.inputs.seed_ids || '' }}
          SKIP_INDEX: ${{ github.event.inputs.skip_index || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
      - name: IndexNow
        if: ${{ github.event.inputs.dry_run != '1' }}
        run: node scripts/indexnow.mjs
        env:
          SUPABASE_URL: https://kjjffgjsgizozleflbhw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
