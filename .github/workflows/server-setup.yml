name: Server setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.FORNEX_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H 5.187.7.227 >> ~/.ssh/known_hosts
      - name: Run setup on server
        run: ssh -o BatchMode=yes root@5.187.7.227 'bash -s' < deploy/server-setup.sh
